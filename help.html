<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>申込画面が表示されない場合</title>

<style>

body{
  margin:0;
  padding:20px;
  background:#f5f5f5;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  color:#333;
}

.container{
  max-width:600px;
  margin:0 auto;
  background:white;
  padding:25px;
  border-radius:16px;
  box-shadow:0 4px 15px rgba(0,0,0,0.08);
}

h1{
  font-size:24px;
  text-align:center;
  margin-top:0;
}

h2{
  font-size:19px;
  margin-top:30px;
}

p{
  line-height:1.8;
}

.step{
  margin:15px 0;
  padding:15px;
  background:#f7f7f7;
  border-radius:10px;
}

.button{
  display:block;
  margin:30px auto 10px;
  padding:16px 20px;
  background:#1976d2;
  color:white;
  text-align:center;
  text-decoration:none;
  border-radius:10px;
  font-size:18px;
  font-weight:bold;
}

.note{
  margin-top:25px;
  padding:15px;
  background:#fff8e1;
  border-radius:10px;
  font-size:14px;
  line-height:1.7;
}

</style>

</head>


<body>

<div class="container">

<h1>
申込画面が表示されない場合
</h1>


<p>
申込画面が正常に表示されない場合は、
以下の方法をお試しください。
</p>


<div class="step">

<strong>① 別のブラウザで開く</strong>

<p>
Chrome、Microsoft Edge、Safariなど、
別のブラウザで申込ページを開いてみてください。
</p>

</div>


<div class="step">

<strong>② 申込ページを直接開く</strong>

<p>
下のボタンから申込ページを直接開いてください。
</p>

</div>


<a
  class="button"
  href="ここにGASの申込URLを入れる"
  target="_blank"
>
事前申込ページを開く
</a>


<div class="step">

<strong>③ 別の端末で試す</strong>

<p>
スマートフォンで表示できない場合は、
パソコンやタブレットなど、別の端末からお試しください。
</p>

</div>


<div class="note">

<strong>※ご注意</strong>

<p>
事前申込が必要です。
申込画面が表示できない場合は、
別のブラウザまたは別の端末からお試しください。
</p>

</div>


</div>

</body>

</html>

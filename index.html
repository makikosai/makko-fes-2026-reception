<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>牧高祭2026 受付</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>

body{
  font-family:sans-serif;
  text-align:center;
  background:#f5f5f5;
  margin:0;
  padding:20px;
}

.container{
  max-width:500px;
  margin:auto;
  background:white;
  padding:20px;
  border-radius:15px;
  box-shadow:0 2px 10px rgba(0,0,0,.15);
}

h1{
  margin-top:5px;
}

#reader{
  width:100%;
  margin:20px auto;
}

#result{
  margin:20px 0;
  padding:25px;
  border-radius:15px;
  font-weight:bold;
  font-size:22px;
  line-height:1.8;
  text-align:center;
  transition:0.3s;
  display:none;
}

.success{
  display:block !important;
  background:#e8f5e9;
  border:3px solid #4caf50;
  color:#1b5e20;
}

.error{
  display:block !important;
  background:#ffebee;
  border:3px solid #f44336;
  color:#b71c1c;
}

.warning{
  display:block !important;
  background:#fff8e1;
  border:3px solid #ff9800;
  color:#e65100;
}

input{
  width:90%;
  max-width:350px;
  padding:12px;
  font-size:18px;
  box-sizing:border-box;
}

button{
  padding:12px 25px;
  margin:10px;
  font-size:18px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

#nextBtn{
  display:none;
}

</style>

</head>

<body>

<div class="container">

<h1>
🏫 牧高祭2026<br>
受付
</h1>

<h2>
📷 QRコード受付
</h2>

<div id="reader"></div>

<div id="result">
QRコードをカメラにかざしてください
</div>

<hr>

<p>
または受付番号を入力
</p>

<input
  id="qrID"
  placeholder="MK26-XXXXXXXX"
>

<br>

<button onclick="manualReception()">
受付
</button>

<button
  id="nextBtn"
  onclick="restartCamera()"
>
次の受付へ
</button>

</div>


<script>

let html5QrCode;

// 受付処理の計測用
let receptionStartTime = 0;

/* =========================
   GAS WebアプリURL
   ========================= */

const GAS_URL =
"https://script.google.com/macros/s/AKfycbyj7HXEiiIkuV9u_5GGjUw3-48LzIa0aQOyo0Mb0AezzneG-wYz8nDkFTdDncQoZPd4/exec";

/* =========================
   カメラ開始
   ========================= */

function startCamera(){

  Html5Qrcode.getCameras()

  .then(devices => {

    if(!devices || devices.length === 0){

      showResult(
        "⚠️ カメラが見つかりません",
        "error"
      );

      return;
    }


    html5QrCode =
      new Html5Qrcode("reader");


    html5QrCode.start(

      devices[0].id,

      {
        fps:10,
        qrbox:250
      },

      (decodedText)=>{

        document
          .getElementById("qrID")
          .value = decodedText;
            
        receptionStartTime = performance.now();

        console.log(
          "📷 QR認識：" +
          receptionStartTime.toFixed(0) +
          " ms"
        );

        html5QrCode.stop();


        manualReception();

      }

    )

    .catch(err => {

      showResult(
        "⚠️ カメラを起動できません<br><br>" +
        String(err),
        "error"
      );

    });

  })

  .catch(err => {

    showResult(
      "⚠️ カメラを取得できません<br><br>" +
      String(err),
      "error"
    );

  });

}


/* =========================
   受付処理
   ========================= */

function manualReception(){

  const qrID =
    document
      .getElementById("qrID")
      .value
      .trim();


  if(qrID === ""){

    showResult(
      "受付番号を入力してください",
      "error"
    );

    return;
  }


  showResult(
    "受付処理中です…",
    ""
  );


  const requestStart = performance.now();


  console.log(
    "📡 fetch送信開始"
  );


  fetch(
    GAS_URL +
    "?qr=" +
    encodeURIComponent(qrID)
  )

  .then(response => {

    console.log(
      "📡 fetch HTTP応答：" +
      (performance.now() - requestStart).toFixed(0) +
      " ms"
    );

    return response.json();

  })

  .then(res => {

    console.log(
      "📡 fetch JSON受信：" +
      (performance.now() - requestStart).toFixed(0) +
      " ms"
    );


    if(res.success){

      playSuccessSound();
          
      showResult(

    "✅ <span style='font-size:38px;'>受付完了！</span><br><br>" +

    "<span style='font-size:32px;'>" +
    res.name +
    " 様</span><br><br>" +

    "<span style='font-size:24px;'>区分：" +
    res.type +
    "</span><br>" +

    "<span style='font-size:24px;'>来場日：" +
    res.day +
    "</span><br><br>" +

    "<span style='font-size:28px;'>🎊 牧高祭2026へ ようこそ！ 🎊</span>",

    "success"

);
         
    }else{

  if(res.message === "登録がありません"){

    showResult(

      "❌ <span style='font-size:34px;'>受付できません</span><br><br>" +

      "<span style='font-size:24px;'>" +
      "このQRコードは登録されていません" +
      "</span><br><br>" +

      "<span style='font-size:20px;'>" +
      "QRコードを確認してください" +
      "</span>",

      "error"

    );

  }else{

    showResult(

      "⚠️ <span style='font-size:34px;'>受付済みです</span><br><br>" +

      "<span style='font-size:24px;'>" +
      res.message +
      "</span>",

      "warning"

    );

  }

}


    document
      .getElementById("nextBtn")
      .style.display =
        "inline-block";

  })

  .catch(error => {

    console.error(error);

    showResult(

      "⚠️ 通信エラー<br><br>" +
      error.message,

      "error"

    );

  });

}


/* =========================
   結果表示
   ========================= */

function playSuccessSound(){

  const audioContext =
    new (window.AudioContext || window.webkitAudioContext)();

  const oscillator =
    audioContext.createOscillator();

  const gain =
    audioContext.createGain();

  oscillator.connect(gain);
  gain.connect(audioContext.destination);

  oscillator.frequency.value = 880;

  gain.gain.setValueAtTime(
    0.2,
    audioContext.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    0.01,
    audioContext.currentTime + 0.3
  );

  oscillator.start();

  oscillator.stop(
    audioContext.currentTime + 0.3
  );

}
      
function showResult(msg,type){

  const result =
    document.getElementById("result");

  result.className = type;

  result.innerHTML = msg;

}


/* =========================
   次の受付
   ========================= */

function restartCamera(){

  document
    .getElementById("qrID")
    .value = "";

  document
    .getElementById("result")
    .innerHTML =
      "QRコードをカメラにかざしてください";

  document
    .getElementById("result")
    .className = "";

  document
    .getElementById("nextBtn")
    .style.display = "none";


  startCamera();

}


/* =========================
   起動
   ========================= */

window.onload = function(){

  startCamera();

};

</script>

</body>
</html>

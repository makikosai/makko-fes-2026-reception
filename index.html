let html5QrCode;

// 受付処理の計測用

const GAS_URL =

/* =========================
   カメラ開始
   ========================= */

function startCamera(){

  Html5Qrcode.getCameras()

  .then(devices => {

    if(!devices || devices.length === 0){

      showResult(
        "⚠️ カメラが見つかりません",
        "error"
      );

      return;
    }


    html5QrCode =
      new Html5Qrcode("reader");


    html5QrCode.start(

      devices[0].id,

      {
        fps:10,
        qrbox:250
      },

      (decodedText)=>{

        document
          .getElementById("qrID")
          .value = decodedText;
            
        receptionStartTime = performance.now();

        console.log(
          "📷 QR認識：" +
          receptionStartTime.toFixed(0) +
          " ms"
        );

        html5QrCode.stop();


        manualReception();

      }

    )

    .catch(err => {

      showResult(
        "⚠️ カメラを起動できません<br><br>" +
        String(err),
        "error"
      );

    });

  })

  .catch(err => {

    showResult(
      "⚠️ カメラを取得できません<br><br>" +
      String(err),
      "error"
    );

  });

}

function playMilestoneSound(){

  const audioContext =
    new (window.AudioContext || window.webkitAudioContext)();

  const now = audioContext.currentTime;

  function note(frequency, start, duration){

    const oscillator =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.type = "triangle";

    oscillator.frequency.value = frequency;

    gain.gain.setValueAtTime(
      0.25,
      start
    );

    gain.gain.exponentialRampToValueAtTime(
      0.01,
      start + duration
    );

    oscillator.start(start);

    oscillator.stop(
      start + duration
    );

  }

  // 🎺 簡易ファンファーレ

  note(523.25, now,       0.20); // ド
  note(659.25, now+0.20,  0.20); // ミ
  note(783.99, now+0.40,  0.20); // ソ
  note(1046.50,now+0.60,  0.45); // 高いド

}

function playSuccessSound(){

  const audio =
    new Audio("stu9-cute-cat-352656.mp3");

  audio.volume = 0.8;

  audio.play();

}
      
function playWarningSound(){

  const audio =
    new Audio("dragon-studio-gentle-horse-neigh-3-499648.mp3");

  audio.volume = 0.8;

  audio.play();

}
      
function playErrorSound(){

  const audioContext =
    new (window.AudioContext || window.webkitAudioContext)();

  const now = audioContext.currentTime;

  function beep(startTime){

    const oscillator =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.type = "square";

    oscillator.frequency.value = 180;

    gain.gain.setValueAtTime(
      0.2,
      startTime
    );

    gain.gain.exponentialRampToValueAtTime(
      0.01,
      startTime + 0.15
    );

    oscillator.start(startTime);

    oscillator.stop(startTime + 0.15);

  }

  beep(now);
  beep(now + 0.22);

}
      
function showResult(msg,type){

  const result =
    document.getElementById("result");

  result.className = type;

  result.innerHTML = msg;

}


/* =========================
   次の受付
   ========================= */

function restartCamera(){

  document
    .getElementById("qrID")
    .value = "";

  document
    .getElementById("result")
    .innerHTML =
      "QRコードをカメラにかざしてください";

  document
    .getElementById("result")
    .className = "";

  document
    .getElementById("nextBtn")
    .style.display = "none";


  startCamera();

}


/* =========================
   起動
   ========================= */

window.onload = function(){

  startCamera();

};
